name: API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run API Tests
        id: api-tests
        run: |
          CMD="npx newman run postman/collections/jsonplaceholder.postman_collection.json"
          CMD="$CMD -e postman/environments/local.postman_environment.json"
          CMD="$CMD --reporters cli,htmlextra"
          CMD="$CMD --reporter-htmlextra-export reports/test-results.html"
          CMD="$CMD --color on"
          
          eval $CMD

      - name: Upload Test Results (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results-html
          path: reports/test-results.html

      - name: Check Test Results
        if: steps.api-tests.outcome != 'success'
        run: |
          echo "API Tests failed!"
          exit 1
