name: API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run API Tests
        id: api-tests
        run: |
          CMD="npx postman collection run postman/collections/jsonplaceholder.postman_collection"
          CMD="$CMD -e postman/environments/Local.environment.yaml"
          CMD="$CMD --reporters cli"
          CMD="$CMD --color on"
          
          eval $CMD

      - name: Check Test Results
        if: steps.api-tests.outcome != 'success'
        run: |
          echo "API Tests failed!"
          exit 1
